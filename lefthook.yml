# Git hooks. The installed hooks are the committed .husky/* scripts (core.hooksPath=.husky, set by
# "npm install"). This file runs the same scripts from scripts/git-hooks/ for a globally installed
# lefthook: use "lefthook run pre-commit" etc. Do not run "lefthook install": it overwrites .husky/*.
#   https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md
#
pre-commit:
  commands:
    secrets:
      run: sh scripts/git-hooks/check-secrets.sh
    lint:
      run: npx --no-install pretty-quick --staged

commit-msg:
  commands:
    conventional:
      run: sh scripts/git-hooks/check-commit-msg.sh {1}

pre-push:
  commands:
    protected-branches:
      use_stdin: true
      run: sh scripts/git-hooks/check-push.sh {1}
